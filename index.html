    <!--
      THESIS: la cartera de una agencia leída de un vistazo, en el lenguaje de
      panel monocromo suave que el cliente fijó como referencia. Rechaza el
      adorno: no hay color, ni ilustración, ni un solo dato inventado.
      OWN-WORLD: fondo gris #EEF0F4, tarjetas blancas de radio 26 con sombra
      muy baja, barra lateral negra redondeada, botones píldora negros, y una

      cuatro columnas y un rail con indicadores, caja en pesos y entregas.
      FORM: direccion fijada por el usuario con tres referencias de panel
      monocromo suave, que sustituyen al mundo de un bit anterior.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance.
